name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - name: Smoke tests against recorded fixtures
        run: |
          sudo apt-get update && sudo apt-get install -y bats
          make smoke
