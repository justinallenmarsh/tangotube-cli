name: Release

# A tag like v0.1.0 builds darwin/linux × amd64/arm64 and a checksums.txt.
# scripts/install.sh and `mise use -g github:justinallenmarsh/tangotube-cli`
# both read /releases/latest, so a tag is all it takes to ship.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make check
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
